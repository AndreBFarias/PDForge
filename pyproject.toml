[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pdfforge"
version = "1.1.0"
description = "Editor de PDF com GUI e ML/AI para Linux"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
authors = [{name = "AndreBFarias"}]
keywords = ["pdf", "editor", "pyqt6", "linux", "ocr", "compressao"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

[project.scripts]
pdfforge = "main:main"

[project.urls]
Homepage = "https://github.com/AndreBFarias/PDForge"
Repository = "https://github.com/AndreBFarias/PDForge"
"Bug Tracker" = "https://github.com/AndreBFarias/PDForge/issues"
Changelog = "https://github.com/AndreBFarias/PDForge/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W", "I", "UP"]
exclude = ["venv/", ".venv/", "docs/sprints/", "QR-Code-Void-Generator/"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "venv/*", ".venv/*", "docs/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
